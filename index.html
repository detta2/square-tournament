<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square Tournament — Who Will Win?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="logo"><span class="logo-sq"></span>SQUARE TOURNAMENT</div>
    <div id="round-label">BRACKET</div>
    <div id="timer">00:00.0</div>
    <div id="controls">
      <button id="btn-start" class="pbtn primary">▶ MULAI</button>
      <button id="btn-speed" class="pbtn hidden" title="Kecepatan simulasi">1x</button>
      <button id="btn-skip" class="pbtn hidden" title="Lewati heat ini">SKIP ⏭</button>
      <button id="btn-full" class="pbtn" title="Layar penuh">⛶</button>
    </div>
  </header>
  <section id="bracket-bar">
    <h1 id="bracket-title">WHO WILL WIN?</h1>
    <div id="bracket-grid"></div>
    <div id="next-tag" class="hidden"></div>
  </section>
  <main id="stage">
    <div id="track-frame">
      <canvas id="game" width="960" height="576"></canvas>
      <div id="banner" class="hidden"><div id="banner-main"></div><div id="banner-sub"></div></div>
    </div>
  </main>
  <section id="champion" class="overlay hidden">
    <div id="champ-star">★</div>
    <h1 id="champ-title">CHAMPION</h1>
    <div id="champ-chip"></div>
    <div id="champ-sub">Pemenang Square Tournament!</div>
    <button id="btn-again" class="pbtn primary">↻ TURNAMEN BARU</button>
  </section>
</div>
<script src="js/maze.js?v=4"></script>
<script src="js/sfx.js?v=4"></script>
<script src="js/race.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
